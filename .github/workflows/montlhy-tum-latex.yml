name: "Monthly tum-latex update"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *"

jobs:
  building:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          PACKAGE_REGISTRY: https://gitlab.lrz.de/api/v4/projects/33555/packages/generic
          PACKAGE_PATH: linux-installer/main
          PACKAGE_FILE: tum-templates-main.tar.gz
        with:
          push: true
          context: .
          file: tum-latex.dockerfile
          platforms: linux/amd64,linux/arm64
          tags: santiagonar1/tum-latex:latest
          secrets: "gitlab_token=${{ secrets.GITLAB_TOKEN }}"
          build-args: |
            INSTALLER_URL=${{ env.PACKAGE_REGISTRY }}/${{ env.PACKAGE_PATH }}/${{ env.PACKAGE_FILE }}
